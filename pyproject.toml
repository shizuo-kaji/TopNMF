[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "topnmf"
# Keep in sync with TopNMF/__init__.py::__version__
version = "1.0.0"
description = "Non-negative Matrix Factorization with topological regularisation via persistent homology."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "TopNMF contributors" }
]
keywords = [
  "nmf",
  "topological data analysis",
  "persistent homology",
  "matrix factorization",
  "pytorch"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "torch>=2.0",
  "matplotlib>=3.6",
  "tqdm>=4.64",
  "scikit-learn>=1.1",
  "cripser>=0.0.24",
  "gudhi>=3.8",
  "networkx>=2.8",
  "imageio-ffmpeg>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
notebook = [
  "nimfa>=1.4.0",
  "pandas>=1.5",
  "scikit-image>=0.22",
  "time-series-nmf>=0.1.0.dev0",
  "wfdb>=4.1",
]
wasserstein = [
  "POT",
  "geomloss",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.hatch.build]
exclude = [
  "/old",
  "/notes",
  "/notebook",
  "/.ipynb_checkpoints"
]

[tool.hatch.build.targets.wheel]
packages = ["TopNMF"]

[tool.hatch.build.targets.sdist]
include = ["TopNMF", "README.md"]
